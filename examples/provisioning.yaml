# Fill placeholders with deployment values before validation.
# Public configuration only. No password or PSK fields are accepted.
prefix: "<REQUIRED>"
isp_gateway: "<REQUIRED>"
router_wan_ip: "<REQUIRED>"
management_prefixes:
  - "<MANAGEMENT_PREFIX_CIDR>"
protected_prefixes:
  - 0.0.0.0/0
crypto:
  ike_encryption: aes-gcm-256
  prf: sha256
  dh_groups: [19, 20]
  esp: esp-gcm-256
  ike_lifetime: 14400
  ipsec_lifetime: 3600
  dpd_interval: 10
  dpd_retries: 3
tunnels:
  - tunnel_id: 100
    headend: "<REQUIRED>"
    local_identity: "<REQUIRED>"
    source_interface: "<REQUIRED>"
    unnumbered_interface: "<REQUIRED>"
    mtu: 1390
    tcp_mss: 1350
    distance: 1
