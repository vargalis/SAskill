# Fill placeholders with deployment values before validation.
router:
  host: "<REQUIRED>"
  port: 830
  username: "<REQUIRED>"
  password:
    env: ISR_PASSWORD
  timeout: 30
secure_access:
  headend: "<REQUIRED>"
  local_identity: "<REQUIRED>"
  remote_identity: "<REQUIRED>"
  psk:
    env: SSE_PSK
  ike_encryption: aes-cbc-256
  ike_integrity: sha256
  dh_group: 19
  ipsec_transform: esp-gcm-256
tunnel:
  name: "<REQUIRED>"
  source_interface: "<REQUIRED>"
  address: "<REQUIRED>"
  mtu: 1390
routing:
  isp_gateway: "<REQUIRED>"
  management_network: "<REQUIRED>"
  protected_networks:
    - 0.0.0.0/0
