[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-for-secureaccess"
version = "0.1.0"
description = "Capability-driven Cisco IOS XE NETCONF provisioning agent"
requires-python = ">=3.11"
dependencies = ["ncclient>=0.6.15,<0.8", "paramiko>=3.2,<5", "pydantic>=2.7,<3", "PyYAML>=6,<7", "lxml>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
secureaccess = "secureaccess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
secureaccess = ["schemas/*.json", "schemas/*.yang"]
